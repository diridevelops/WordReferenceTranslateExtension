name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build Edge
        run: npm run build

      - name: Build Chrome
        run: npm run build:chrome

      - name: Build Firefox
        env:
          WXT_FIREFOX_ADDON_ID: ci-firefox-addon@example.com
          WXT_FIREFOX_STRICT_MIN_VERSION: "115.0"
        run: npm run build:firefox

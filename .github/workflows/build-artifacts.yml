name: Build Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WXT_FIREFOX_ADDON_ID: ${{ vars.WXT_FIREFOX_ADDON_ID }}
      WXT_FIREFOX_STRICT_MIN_VERSION: ${{ vars.WXT_FIREFOX_STRICT_MIN_VERSION || '115.0' }}
      WRT_EXTENSION_AUTHOR_NAME: ${{ vars.WRT_EXTENSION_AUTHOR_NAME }}
      WRT_EXTENSION_AUTHOR_EMAIL: ${{ vars.WRT_EXTENSION_AUTHOR_EMAIL }}
      WRT_EXTENSION_AUTHOR_WEBSITE: ${{ vars.WRT_EXTENSION_AUTHOR_WEBSITE }}
      WRT_EXTENSION_REPO_URL: ${{ vars.WRT_EXTENSION_REPO_URL }}
      WRT_EXTENSION_DONATION_URL: ${{ vars.WRT_EXTENSION_DONATION_URL }}
      WRT_CHANGELOG_ITEMS: ${{ vars.WRT_CHANGELOG_ITEMS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Firefox add-on ID
        run: |
          if [ -z "$WXT_FIREFOX_ADDON_ID" ]; then
            echo "WXT_FIREFOX_ADDON_ID must be configured as a GitHub repository variable."
            exit 1
          fi

      - name: Create .env for source package
        run: |
          cat > .env <<EOF
          WXT_FIREFOX_ADDON_ID=$WXT_FIREFOX_ADDON_ID
          WXT_FIREFOX_STRICT_MIN_VERSION=$WXT_FIREFOX_STRICT_MIN_VERSION
          WRT_EXTENSION_AUTHOR_NAME=$WRT_EXTENSION_AUTHOR_NAME
          WRT_EXTENSION_AUTHOR_EMAIL=$WRT_EXTENSION_AUTHOR_EMAIL
          WRT_EXTENSION_AUTHOR_WEBSITE=$WRT_EXTENSION_AUTHOR_WEBSITE
          WRT_EXTENSION_REPO_URL=$WRT_EXTENSION_REPO_URL
          WRT_EXTENSION_DONATION_URL=$WRT_EXTENSION_DONATION_URL
          WRT_CHANGELOG_ITEMS=$WRT_CHANGELOG_ITEMS
          EOF

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Package Edge
        run: npm run zip

      - name: Package Chrome
        run: npm run zip:chrome

      - name: Package Firefox
        run: npm run zip:firefox

      - name: List packaged artifacts
        run: |
          ls -lh .output/*.zip

      - name: Upload store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: store-artifacts
          path: .output/*.zip
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true
